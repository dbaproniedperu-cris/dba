# Ajustes que instalar-mame.ps1 aplica sobre el mame.ini que genera MAME (mame.exe -createconfig).
# Formato: una opcion por linea, "clave valor". Las lineas con # son comentarios.
# MAME no admite comentarios al final de una linea: van siempre en su propia linea.
# Si una clave no existe en la version instalada, el script avisa y la omite.

# --- Pantalla completa sin cambiar la resolucion del escritorio (4K se queda en 4K) ---
window                    0
maximize                  1
switchres                 0

# --- Pixel perfecto: solo escalas enteras, sin suavizado ---
keepaspect                1
unevenstretch             0
filter                    0

# --- Motor de video moderno (DirectX 11/12 o Vulkan, lo elige MAME) ---
video                     bgfx
bgfx_backend              auto
# Cadena de efectos: "unfiltered" = pixeles nitidos.
# Para el efecto de pantalla de tubo (CRT), cambia a: crt-geom
bgfx_screen_chains        unfiltered

# --- Sincronizacion con el monitor, sin cortes de imagen ---
waitvsync                 1

# --- Mandos: XInput (Xbox y compatibles) + DirectInput (PlayStation, genericos) a la vez ---
joystick                  1
joystickprovider          winhybrid
joystick_deadzone         0.20

# --- Comodidad ---
skip_gameinfo             1
# Guarda los records de juegos antiguos entre partidas
plugin                    hiscore
